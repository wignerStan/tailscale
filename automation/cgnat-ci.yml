name: CGNAT direct UDP
on:
  pull_request:
    paths: ['net/netmon/**', 'util/linuxfw/**', 'scripts/test-cgnat-kernel.sh', '.github/workflows/cgnat.yml', 'go.mod', 'go.sum']
  push:
    branches: [integration/tailscale-system-interface, fix/cgnat-direct-udp-native, fix/cgnat-direct-udp-1.94.2]
    paths: ['net/netmon/**', 'util/linuxfw/**', 'scripts/test-cgnat-kernel.sh', '.github/workflows/cgnat.yml', 'go.mod', 'go.sum']
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Discovery and ownership regression tests
        run: |
          go test -race -count=1 ./net/netmon
          go vet ./net/netmon
      - name: Linux firewall unit and kernel tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 iptables nftables
          go test -race -count=1 ./util/linuxfw
          go vet ./util/linuxfw
          go test -c -tags cgnat_integration -o "$RUNNER_TEMP/cgnat-firewall.test" ./util/linuxfw
          bash scripts/test-cgnat-kernel.sh "$RUNNER_TEMP/cgnat-firewall.test"
      - name: Build standalone Linux peer when present
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          if test -d cmd/tailscaled; then
            stamp="1.94.2-cgnat-$(git rev-parse --short=12 HEAD)"
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X tailscale.com/version.longStamp=$stamp -X tailscale.com/version.shortStamp=1.94.2" -o artifacts/tailscaled ./cmd/tailscaled
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X tailscale.com/version.longStamp=$stamp -X tailscale.com/version.shortStamp=1.94.2" -o artifacts/tailscale ./cmd/tailscale
          fi
          git rev-parse HEAD > artifacts/SOURCE_COMMIT
          git diff --exit-code -- go.mod go.sum
          git archive HEAD | gzip > artifacts/source.tar.gz
          (cd artifacts && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: cgnat-linux-${{ github.sha }}
          path: artifacts/
          retention-days: 30
