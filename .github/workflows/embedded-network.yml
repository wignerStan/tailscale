name: Embedded system dataplane
on:
  push:
    branches: [integration/system-20261102]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Set Darwin SDK
        if: runner.os == 'macOS'
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "MACSDK=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Verify system dataplane and physical transport
        run: |
          packages="./tsnet ./net/netmon ./wgengine/magicsock"
          if [ "${{ runner.os }}" = Linux ]; then packages="$packages ./util/linuxfw"; fi
          go test -race -count=1 $packages
          go vet $packages
