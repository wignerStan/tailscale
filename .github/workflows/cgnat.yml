name: CGNAT direct UDP
on:
  pull_request:
    branches: [integration/tailscale-system-interface]
    paths: ['net/netmon/**', 'util/linuxfw/**', 'scripts/test-cgnat-kernel.sh', '.github/workflows/cgnat.yml', 'go.mod', 'go.sum']
  push:
    branches: [integration/tailscale-system-interface, fix/cgnat-direct-udp-native]
    paths: ['net/netmon/**', 'util/linuxfw/**', 'scripts/test-cgnat-kernel.sh', '.github/workflows/cgnat.yml', 'go.mod', 'go.sum']
permissions:
  contents: read
concurrency:
  group: cgnat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Discovery and ownership tests
        run: |
          go test -race -count=1 ./net/netmon
          go vet ./net/netmon
      - name: Linux firewall units and actual packet tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 iptables nftables
          go test -race -count=1 ./util/linuxfw
          go vet ./util/linuxfw
          go test -c -tags cgnat_integration -o "$RUNNER_TEMP/cgnat-firewall.test" ./util/linuxfw
          bash scripts/test-cgnat-kernel.sh "$RUNNER_TEMP/cgnat-firewall.test"
      - name: Verify clean module and archive source
        if: runner.os == 'Linux'
        run: |
          git diff --exit-code -- go.mod go.sum
          mkdir artifacts
          git rev-parse HEAD > artifacts/SOURCE_COMMIT
          git archive HEAD | gzip > artifacts/source.tar.gz
          (cd artifacts && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: cgnat-native-source
          path: artifacts/
          retention-days: 30
