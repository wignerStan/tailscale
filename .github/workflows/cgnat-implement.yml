name: Publish CGNAT fixes
on:
  push:
    branches: [fix/cgnat-direct-udp]
    paths: [.github/workflows/cgnat-implement.yml, automation/cgnat_fix.py, automation/test-cgnat-kernel.sh]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/cgnat-direct-udp-native
          path: core
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/cgnat-direct-udp-1.94.2
          path: backport
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Apply narrowly scoped changes
        run: |
          set -euxo pipefail
          python3 control/automation/cgnat_fix.py core
          python3 control/automation/cgnat_fix.py backport backport
          for repo in core backport; do
            mkdir -p "$repo/scripts"
            cp control/automation/test-cgnat-kernel.sh "$repo/scripts/test-cgnat-kernel.sh"
            gofmt -w "$repo/net/netmon/state.go" "$repo/net/netmon/interfaces.go" "$repo/net/netmon/local_addresses_cgnat_test.go" "$repo/util/linuxfw/iptables_runner.go" "$repo/util/linuxfw/nftables_runner.go" "$repo/util/linuxfw/"*cgnat*go
            git -C "$repo" diff --check
          done
      - name: Validate units and real UDP firewall behavior
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 iptables nftables
          for repo in core backport; do
            (cd "$repo" && go test -race -count=1 ./net/netmon ./util/linuxfw && go vet ./net/netmon ./util/linuxfw)
            (cd "$repo" && go test -c -tags cgnat_integration -o "$RUNNER_TEMP/$repo-firewall.test" ./util/linuxfw)
            bash "$repo/scripts/test-cgnat-kernel.sh" "$RUNNER_TEMP/$repo-firewall.test"
          done
      - name: Commit and push source-only fork branches
        run: |
          set -euxo pipefail
          for repo in core backport; do
            git -C "$repo" config user.name 'github-actions[bot]'
            git -C "$repo" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$repo" add net/netmon util/linuxfw CGNAT_DIRECT_UDP.md scripts/test-cgnat-kernel.sh
          done
          git -C core commit -s -m 'fix(netmon,linuxfw): allow direct UDP on CGNAT underlays'
          git -C core push origin HEAD:refs/heads/fix/cgnat-direct-udp-native
          git -C backport commit -s -m 'fix(netmon,linuxfw): backport CGNAT direct UDP support to 1.94.2'
          git -C backport push origin HEAD:refs/heads/fix/cgnat-direct-udp-1.94.2
          echo "Native: $(git -C core rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Standalone: $(git -C backport rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
